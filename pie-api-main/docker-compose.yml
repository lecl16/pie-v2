services:
  app:
    build: .
    container_name: pie_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started
    env_file:
      - .env
    environment:
      - TZ=Europe/Lisbon
    # No published port: clients reach the API only through Caddy, which
    # terminates TLS. Uvicorn trusts Caddy's X-Forwarded-For for client IPs.
    expose:
      - "8000"
    volumes:
      - .:/app
      - app_files:/home
      - tunnel_data:/wg

    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--forwarded-allow-ips", "*"]

  # The device port: TLS-PSK for the exam devices (app/device_tls_server.py,
  # README.md, "Device TLS-PSK"). Same image and code as `app`; published
  # directly, since Caddy cannot terminate TLS-PSK.
  device-api:
    build: .
    container_name: pie_device_api
    # Both this and `app` update the schema at startup, one at a time
    # (a MySQL lock in app/core/database.py).
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started
    env_file:
      - .env
    environment:
      - TZ=Europe/Lisbon
    ports:
      - "8444:8444"
    volumes:
      - .:/app
      - app_files:/home
      - tunnel_data:/wg
    command: ["python", "-m", "app.device_tls_server"]

  # The dashboard (WebApp-main/webapp). No published port: Caddy serves it
  # over HTTPS on 3000. The API's address is compiled in: PIE_API_URL in
  # .env, rebuild after changing it.
  webapp:
    build:
      context: ../WebApp-main/webapp
      args:
        NEXT_PUBLIC_API_URL: ${PIE_API_URL:-}
    container_name: pie_webapp
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro

  # The exam devices' WireGuard tunnels (app/core/tunnel.py): wg0 on
  # TUNNEL_SERVER_IP, peers from the shared volume. Caddy shares this
  # service's network, so it sees the devices' tunnel addresses; that is why
  # Caddy's ports are published here.
  wireguard:
    build: ./wireguard
    container_name: pie_wireguard
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    environment:
      - TUNNEL_SERVER_IP=${TUNNEL_SERVER_IP:-10.77.0.1}
    ports:
      - "${TUNNEL_PORT:-51820}:51820/udp"
      - "8000:8000"
      - "8443:8443"
      - "3000:3000"
    volumes:
      - tunnel_data:/wg

  # HTTPS for everyone on 8000; HTTPS with a required phone client
  # certificate on 8443; the dashboard on 3000; the exam apps, through the
  # devices' tunnels only, on 8001 (see Caddyfile).
  caddy:
    image: caddy:2.10
    container_name: pie_caddy
    restart: unless-stopped
    depends_on:
      - app
      - webapp
      - wireguard
    network_mode: "service:wireguard"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data

  db:
    image: mysql:8.0
    container_name: mysql_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ : Europe/Lisbon
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7
    container_name: redis_broker
    restart: unless-stopped
    environment:
      - TZ=Europe/Lisbon
    ports:
      - "6379:6379"
  
  # Interface to interact with the database
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_container
    restart: always
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "8080:80"

  clamav:
    image: clamav/clamav:stable
    container_name: clamav_container
    ports:
      - "3310:3310"
    volumes:
      - ./clamav:/var/lib/clamav
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - TZ=Europe/Lisbon

    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    restart: always

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.9
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    restart: unless-stopped

volumes:
  caddy_data:
  tunnel_data:
  mysql_data:
  app_files:
  clamav_data:
  elasticsearch_data: