services:
  app:
    build: .
    container_name: pie_api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started
    env_file:
      - .env
    environment:
      - TZ=Europe/Lisbon
    # No published port: clients reach the API only through Caddy, which
    # terminates TLS. Uvicorn trusts Caddy's X-Forwarded-For for client IPs.
    expose:
      - "8000"
    volumes:
      - .:/app
      - app_files:/home

    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--forwarded-allow-ips", "*"]

  # HTTPS for everyone on 8000; HTTPS with a required phone client
  # certificate on 8443 (see Caddyfile).
  caddy:
    image: caddy:2.10
    container_name: pie_caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8000:8000"
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data

  db:
    image: mysql:8.0
    container_name: mysql_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ : Europe/Lisbon
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7
    container_name: redis_broker
    restart: unless-stopped
    environment:
      - TZ=Europe/Lisbon
    ports:
      - "6379:6379"
  
  # Interface to interact with the database
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_container
    restart: always
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "8080:80"

  clamav:
    image: clamav/clamav:stable
    container_name: clamav_container
    ports:
      - "3310:3310"
    volumes:
      - ./clamav:/var/lib/clamav
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - TZ=Europe/Lisbon

    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    restart: always

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.9
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    restart: unless-stopped

volumes:
  caddy_data:
  mysql_data:
  app_files:
  clamav_data:
  elasticsearch_data: