# DNS on the exam host: the PIE device's forwarder, over the USB link
# (10-usb0.network). Written at boot rather than shipped as /etc/resolv.conf,
# which live-build would also copy into the build chroot, breaking the
# hooks' downloads.
f+ /etc/resolv.conf 0644 root root - nameserver 192.168.7.2\n
